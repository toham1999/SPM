name: SPM

channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.8
  - numpy=1.24.4
  - scipy=1.10.1
  - pandas=2.0.3
  - matplotlib=3.7.2
  - scikit-image=0.21.0
  - pillow=10.0.0
  - h5py=3.10.0
  - imageio=2.27.0
  - tifffile=2023.7.10
  - networkx=3.1
  - numexpr
  - pywavelets=1.4.1
  - pyzmq=25.1.1
  - dask=2023.5.0
  - sympy=1.12
  - jupyter
  - jupyterlab
  - notebook
  - ipython
  - ipykernel
  - pyqt
  - pip
  - pip:
      - gwyfile==0.2.0
      - matplotlib-scalebar==0.8.1

# -----------------------------------------------------------------------------
# SETUP
# -----------------------------------------------------------------------------
# 1. Create the environment:
#
#     conda env create -f environment.yml
#
# 2. Activate the environment:
#
#     conda activate SPM
#
# 3. Install HyperSpy separately:
#
#     python -m pip install --no-deps hyperspy==1.7.5
#
# 4. Install the remaining HyperSpy packages:
#
#     python -m pip install --no-deps hyperspy-gui-traitsui==1.5.3 hyperspyui==1.3.1 hystorian==1.0.5.2 pyface==8.0.0 traits==6.4.2 traitsui==7.4.3 sparse==0.14.0 zarr==2.16.1
#
# -----------------------------------------------------------------------------